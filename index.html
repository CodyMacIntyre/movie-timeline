<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Movie Timeline</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #111;
      color: #fff;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      margin-bottom: 15px;
    }

    .movie {
      background: #222;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .movie:hover {
      background: #333;
    }

    .movie-title {
      font-size: 20px;
      font-weight: bold;
    }

    .movie-id {
      color: #999;
      font-size: 14px;
      margin-top: 5px;
    }

    .message {
      color: #aaa;
      text-align: center;
      margin-top: 20px;
    }

    .back-button {
      display: inline-block;
      background: #333;
      color: #fff;
      padding: 10px 15px;
      border-radius: 7px;
      cursor: pointer;
      margin-bottom: 25px;
    }

    .back-button:hover {
      background: #444;
    }

    .movie-page {
      background: #222;
      border-radius: 12px;
      padding: 25px;
    }

    .movie-page h2 {
      font-size: 32px;
      margin-top: 5px;
      margin-bottom: 25px;
    }

    .year-label {
      color: #aaa;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .game-year {
      font-size: 64px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .section {
      border-top: 1px solid #444;
      padding-top: 20px;
      margin-top: 20px;
    }

    .section h3 {
      margin-top: 0;
      font-size: 20px;
    }

    .game-date {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .release-entry {
      margin-bottom: 15px;
    }

    .release-date {
      font-weight: bold;
    }

    .release-type {
      color: #aaa;
      font-size: 14px;
      margin-top: 3px;
    }

    .detail-row {
      margin-bottom: 16px;
    }

    .detail-label {
      color: #aaa;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 17px;
    }

    .actor-list {
      margin: 0;
      padding-left: 20px;
    }

    .actor-list li {
      margin-bottom: 5px;
    }

    .genre-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .genre {
      background: #333;
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 13px;
    }

    .boost-section {
      border: 1px solid #555;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
    }

    .boost-section h3 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .boost {
      background: #333;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .no-boosts {
      color: #777;
      font-style: italic;
      font-size: 14px;
    }

  </style>

</head>


<body>

  <h1>🎬 Movie Timeline</h1>

  <div id="app">

    <div class="message">
      Loading movie database...
    </div>

  </div>


  <script>

    let movies = [];


    /*
      ============================================================
      LOAD MOVIE DATABASE
      ============================================================
    */

    fetch("movies.json")

      .then(response => {

        if (!response.ok) {
          throw new Error("Could not load movie database.");
        }

        return response.json();

      })

      .then(data => {

        movies = data.movies;

        showHome();

      })

      .catch(error => {

        document.getElementById("app").innerHTML = `

          <div class="message">

            Unable to load the movie database.

            <br><br>

            Please try refreshing the page.

          </div>

        `;

        console.error(error);

      });


    /*
      ============================================================
      HOME / SEARCH
      ============================================================
    */

    function showHome() {

      document.getElementById("app").innerHTML = `

        <div class="subtitle">
          Search for a movie
        </div>

        <input
          type="text"
          id="search"
          placeholder="Search movies..."
          oninput="searchMovies()"
          autocomplete="off"
        >

        <div id="results"></div>

      `;

      document.getElementById("results").innerHTML =
        '<div class="message">Start typing to search.</div>';

    }


    /*
      ============================================================
      SEARCH
      ============================================================
    */

    function searchMovies() {

      const search = document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

      const results =
        document.getElementById("results");


      if (search === "") {

        results.innerHTML =
          '<div class="message">Start typing to search.</div>';

        return;

      }


      const matches = movies.filter(movie =>

        movie.title
          .toLowerCase()
          .includes(search)

        ||

        movie.id
          .toLowerCase()
          .includes(search)

      );


      if (matches.length === 0) {

        results.innerHTML =
          '<div class="message">No movies found.</div>';

        return;

      }


      results.innerHTML = matches.map(movie => `

        <div
          class="movie"
          onclick="showMovie('${movie.id}')"
        >

          <div class="movie-title">
            ${movie.title}
          </div>

          <div class="movie-id">
            ${movie.id}
          </div>

        </div>

      `).join("");

    }


    /*
      ============================================================
      MOVIE PAGE
      ============================================================
    */

    function showMovie(id) {

      const movie =
        movies.find(movie => movie.id === id);


      if (!movie) {

        showHome();

        return;

      }


      /*
        RELEASE HISTORY
      */

      const releaseHistoryHTML =
        movie.releaseHistory.map(release => `

          <div class="release-entry">

            <div class="release-date">
              ${release.date}
            </div>

            <div class="release-type">
              ${release.type}
            </div>

          </div>

        `).join("");


      /*
        ACTORS
      */

      const actorHTML =
        movie.actors.map(actor => `

          <li>
            ${actor}
          </li>

        `).join("");


      /*
        GENRES
      */

      const genreHTML =
        movie.genre.map(genre => `

          <span class="genre">
            ${genre}
          </span>

        `).join("");


      /*
        BOOSTS

        This is already connected to the JSON.

        Once we create actual boost cards, we simply put
        them into the movie's "boosts" array.
      */

      let boostsHTML = "";


      if (movie.boosts && movie.boosts.length > 0) {

        boostsHTML = `

          <div class="boost-section">

            <h3>
              🎞️ Active Boosts
            </h3>

            ${movie.boosts.map(boost => `

              <div class="boost">
                ${boost}
              </div>

            `).join("")}

          </div>

        `;

      }


      /*
        MOVIE PAGE
      */

      document.getElementById("app").innerHTML = `

        <div
          class="back-button"
          onclick="showHome()"
        >
          ← Back to Search
        </div>


        <div class="movie-page">


          <div class="movie-id">
            ${movie.id}
          </div>


          <h2>
            ${movie.title}
          </h2>


          <!-- GAME ANSWER -->

          <div class="year-label">
            Game Release Year
          </div>

          <div class="game-year">
            ${movie.gameYear}
          </div>


          <!-- ACTIVE BOOSTS -->

          ${boostsHTML}


          <!-- RELEASE INFORMATION -->

          <div class="section">

            <h3>
              Release Information
            </h3>

            <div class="game-date">

              <strong>
                Game Release Date:
              </strong>

              ${movie.gameDate}

            </div>

            <div class="release-type">

              This is the release date used to determine
              the movie's year in Movie Timeline.

            </div>

          </div>


          <!-- RELEASE HISTORY -->

          <div class="section">

            <h3>
              Release History
            </h3>

            ${releaseHistoryHTML}

          </div>


          <!-- MOVIE DETAILS -->

          <div class="section">

            <h3>
              Movie Details
            </h3>


            <div class="detail-row">

              <div class="detail-label">
                Director
              </div>

              <div class="detail-value">
                ${movie.director}
              </div>

            </div>


            <div class="detail-row">

              <div class="detail-label">
                Actors
              </div>

              <div class="detail-value">

                <ul class="actor-list">

                  ${actorHTML}

                </ul>

              </div>

            </div>


            <div class="detail-row">

              <div class="detail-label">
                Genre
              </div>

              <div class="genre-list">

                ${genreHTML}

              </div>

            </div>


            <div class="detail-row">

              <div class="detail-label">
                Runtime
              </div>

              <div class="detail-value">
                ${movie.runtime}
              </div>

            </div>


          </div>


        </div>

      `;

    }

  </script>

</body>

</html>
