<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Roll Credits</title>


  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #111;
      color: #fff;
    }


    h1 {
      text-align: center;
      margin-bottom: 10px;
    }


    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }


    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      margin-bottom: 15px;
    }


    .movie {
      background: #222;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      cursor: pointer;
    }


    .movie:hover {
      background: #333;
    }


    .movie-title {
      font-size: 20px;
      font-weight: bold;
    }


    .movie-id {
      color: #999;
      font-size: 14px;
      margin-top: 5px;
    }


    .message {
      color: #aaa;
      text-align: center;
      margin-top: 20px;
    }


    .back-button {
      display: inline-block;
      background: #333;
      color: #fff;
      padding: 10px 15px;
      border-radius: 7px;
      cursor: pointer;
      margin-bottom: 25px;
    }


    .back-button:hover {
      background: #444;
    }


    /*
      ============================================================
      SINGLE MOVIE / VERSION
      ============================================================
    */


    .movie-page {
      background: #222;
      border-radius: 12px;
      padding: 25px;
    }


    .movie-page h2 {
      font-size: 32px;
      margin-top: 5px;
      margin-bottom: 25px;
    }


    .year-label {
      color: #aaa;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }


    .game-year {
      font-size: 64px;
      font-weight: bold;
      margin-bottom: 20px;
    }


    /*
      ============================================================
      MULTIPLE VERSIONS
      ============================================================
    */


    .version-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(280px, 1fr)
      );

      gap: 20px;
      margin-top: 20px;
    }


    .version-card {
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 20px;
    }


    .version-year {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 20px;
    }


    .version-label {
      color: #aaa;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }


    /*
      ============================================================
      SECTIONS
      ============================================================
    */


    .section {
      border-top: 1px solid #444;
      padding-top: 20px;
      margin-top: 20px;
    }


    .section h3 {
      margin-top: 0;
      font-size: 20px;
    }


    .game-date {
      font-size: 18px;
      margin-bottom: 10px;
    }


    .release-entry {
      margin-bottom: 15px;
    }


    .release-date {
      font-weight: bold;
    }


    .release-type {
      color: #aaa;
      font-size: 14px;
      margin-top: 3px;
    }


    .detail-row {
      margin-bottom: 16px;
    }


    .detail-label {
      color: #aaa;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }


    .detail-value {
      font-size: 17px;
    }


    .actor-list {
      margin: 0;
      padding-left: 20px;
    }


    .actor-list li {
      margin-bottom: 5px;
    }


    .genre-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }


    .genre {
      background: #333;
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 13px;
    }


    /*
      ============================================================
      BOOSTS
      ============================================================
    */


    .boost-section {
      border: 1px solid #555;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
    }


    .boost-section h3 {
      margin-top: 0;
      margin-bottom: 12px;
    }


    .boost {
      background: #333;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }


    /*
      ============================================================
      MOBILE
      ============================================================
    */


    @media (max-width: 600px) {

      body {
        padding: 20px 12px;
      }


      .movie-page {
        padding: 18px;
      }


      .movie-page h2 {
        font-size: 27px;
      }


      .game-year {
        font-size: 52px;
      }


      .version-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <h1>🎬 Roll Credits</h1>


  <div id="app">

    <div class="message">
      Loading movie database...
    </div>

  </div>


  <script>


    let movies = [];


    /*
      ============================================================
      LOAD MOVIE DATABASE
      ============================================================
    */


    fetch("movies.json")

      .then(response => {

        if (!response.ok) {

          throw new Error(
            "Could not load movie database."
          );

        }

        return response.json();

      })


      .then(data => {

        movies = data.movies;

        showHome();

      })


      .catch(error => {

        document.getElementById("app").innerHTML = `

          <div class="message">

            Unable to load the movie database.

            <br><br>

            Please try refreshing the page.

          </div>

        `;

        console.error(error);

      });


    /*
      ============================================================
      GROUP MOVIES BY TITLE
      ============================================================
    */


    function groupMoviesByTitle() {

      const groups = {};


      movies.forEach(movie => {

        const key =
          movie.title
            .trim()
            .toLowerCase();


        if (!groups[key]) {

          groups[key] = [];

        }


        groups[key].push(movie);

      });


      return groups;

    }


    /*
      ============================================================
      HOME / SEARCH
      ============================================================
    */


    function showHome() {

      document.getElementById("app").innerHTML = `

        <div class="subtitle">
          Search for a movie
        </div>


        <input
          type="text"
          id="search"
          placeholder="Search movies..."
          oninput="searchMovies()"
          autocomplete="off"
        >


        <div id="results"></div>

      `;


      document.getElementById("results").innerHTML =

        '<div class="message">Start typing to search.</div>';

    }


    /*
      ============================================================
      SEARCH
      ============================================================
    */


    function searchMovies() {

      const search =

        document
          .getElementById("search")
          .value
          .toLowerCase()
          .trim();


      const results =
        document.getElementById("results");


      if (search === "") {

        results.innerHTML =

          '<div class="message">Start typing to search.</div>';

        return;

      }


      const groups =
        groupMoviesByTitle();


      const matchingTitles =

        Object.keys(groups).filter(title =>

          title.includes(search)

        );


      if (matchingTitles.length === 0) {

        results.innerHTML =

          '<div class="message">No movies found.</div>';

        return;

      }


      results.innerHTML =

        matchingTitles.map(title => {

          const versions =
            groups[title];


          return `

            <div
              class="movie"
              onclick="showMovieGroup('${encodeURIComponent(title)}')"
            >

              <div class="movie-title">

                ${versions[0].title}

              </div>


              <div class="movie-id">

                ${versions.length === 1

                  ? "1 movie"

                  : versions.length + " versions"}

              </div>

            </div>

          `;

        }).join("");

    }


    /*
      ============================================================
      SHOW TITLE GROUP
      ============================================================
    */


    function showMovieGroup(encodedTitle) {

      const title =
        decodeURIComponent(encodedTitle);


      const groups =
        groupMoviesByTitle();


      const versions =
        groups[title];


      if (!versions) {

        showHome();

        return;

      }


      /*
        SINGLE VERSION
      */


      if (versions.length === 1) {

        showSingleMovie(versions[0]);

        return;

      }


      /*
        MULTIPLE VERSIONS
      */


      const versionHTML =

        versions.map(movie =>

          buildVersionCard(movie)

        ).join("");


      document.getElementById("app").innerHTML = `

        <div
          class="back-button"
          onclick="showHome()"
        >

          ← Back to Search

        </div>


        <div class="movie-page">


          <div class="movie-id">

            ${versions.length} versions found

          </div>


          <h2>

            ${versions[0].title}

          </h2>


          <div class="section">

            <h3>

              Release Versions

            </h3>


            <div class="version-grid">

              ${versionHTML}

            </div>

          </div>


        </div>

      `;

    }


    /*
      ============================================================
      BUILD VERSION CARD
      ============================================================
    */


    function buildVersionCard(movie) {


      const actorHTML =

        movie.actors.map(actor => `

          <li>${actor}</li>

        `).join("");


      const genreHTML =

        movie.genre.map(genre => `

          <span class="genre">

            ${genre}

          </span>

        `).join("");


      const releaseHistoryHTML =

        movie.releaseHistory.map(release => `

          <div class="release-entry">

            <div class="release-date">

              ${release.date}

            </div>


            <div class="release-type">

              ${release.type}

            </div>

          </div>

        `).join("");


      return `

        <div class="version-card">


          <div class="version-label">

            Game Release Year

          </div>


          <div class="version-year">

            ${movie.gameYear}

          </div>


          <div class="detail-row">

            <div class="detail-label">

              Director

            </div>


            <div class="detail-value">

              ${movie.director}

            </div>

          </div>


          <div class="detail-row">

            <div class="detail-label">

              Actors

            </div>


            <div class="detail-value">

              <ul class="actor-list">

                ${actorHTML}

              </ul>

            </div>

          </div>


          <div class="detail-row">

            <div class="detail-label">

              Genre

            </div>


            <div class="genre-list">

              ${genreHTML}

            </div>

          </div>


          <div class="detail-row">

            <div class="detail-label">

              Runtime

            </div>


            <div class="detail-value">

              ${movie.runtime}

            </div>

          </div>


          <div class="section">


            <h3>

              Release Information

            </h3>


            <div class="game-date">

              <strong>

                Game Release Date:

              </strong>

              ${movie.gameDate}

            </div>


            <div class="release-type">

              This is the release date used to determine

              the movie's year in Movie Timeline.

            </div>


          </div>


          <div class="section">


            <h3>

              Release History

            </h3>


            ${releaseHistoryHTML}


          </div>


        </div>

      `;

    }


    /*
      ============================================================
      SINGLE MOVIE
      ============================================================
    */


    function showSingleMovie(movie) {


      const actorHTML =

        movie.actors.map(actor => `

          <li>${actor}</li>

        `).join("");


      const genreHTML =

        movie.genre.map(genre => `

          <span class="genre">

            ${genre}

          </span>

        `).join("");


      const releaseHistoryHTML =

        movie.releaseHistory.map(release => `

          <div class="release-entry">

            <div class="release-date">

              ${release.date}

            </div>


            <div class="release-type">

              ${release.type}

            </div>

          </div>

        `).join("");


      let boostsHTML = "";


      if (

        movie.boosts &&

        movie.boosts.length > 0

      ) {

        boostsHTML = `

          <div class="boost-section">

            <h3>

              🎞️ Active Boosts

            </h3>


            ${movie.boosts.map(boost => `

              <div class="boost">

                ${boost}

              </div>

            `).join("")}

          </div>

        `;

      }


      document.getElementById("app").innerHTML = `

        <div
          class="back-button"
          onclick="showHome()"
        >

          ← Back to Search

        </div>


        <div class="movie-page">


          <div class="movie-id">

            ${movie.id}

          </div>


          <h2>

            ${movie.title}

          </h2>


          <div class="year-label">

            Game Release Year

          </div>


          <div class="game-year">

            ${movie.gameYear}

          </div>


          ${boostsHTML}


          <div class="section">


            <h3>

              Release Information

            </h3>


            <div class="game-date">

              <strong>

                Game Release Date:

              </strong>

              ${movie.gameDate}

            </div>


            <div class="release-type">

              This is the release date used to determine

              the movie's year in Movie Timeline.

            </div>


          </div>


          <div class="section">


            <h3>

              Release History

            </h3>


            ${releaseHistoryHTML}


          </div>


          <div class="section">


            <h3>

              Movie Details

            </h3>


            <div class="detail-row">

              <div class="detail-label">

                Director

              </div>


              <div class="detail-value">

                ${movie.director}

              </div>

            </div>


            <div class="detail-row">

              <div class="detail-label">

                Actors

              </div>


              <div class="detail-value">

                <ul class="actor-list">

                  ${actorHTML}

                </ul>

              </div>

            </div>


            <div class="detail-row">

              <div class="detail-label">

                Genre

              </div>


              <div class="genre-list">

                ${genreHTML}

              </div>

            </div>


            <div class="detail-row">

              <div class="detail-label">

                Runtime

              </div>


              <div class="detail-value">

                ${movie.runtime}

              </div>

            </div>


          </div>


        </div>

      `;

    }


  </script>

</body>

</html>
